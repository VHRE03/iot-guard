spring.application.name=iot-guard

# PostgreSQL (credenciales de docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/iotguard_db
spring.datasource.username=iotguard_user
spring.datasource.password=iotguard_pass

# Flyway: gestion del esquema con las migraciones en db/migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate: el esquema lo define Flyway, Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
